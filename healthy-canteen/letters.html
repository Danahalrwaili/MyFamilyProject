<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تمارين تفاعليه</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lateef&display=swap" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</head>

<body dir="rtl">
  <section id="topScreen">
        <a href="../index.html" id="backArrow">&#8592;</a>
        </section>

<main class="container py-4">
<ul class="nav nav-pills mb-3"></ul>

<div class="tab-content">
  <div class="tab-pane fade show active" id="g1">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="progress-small" style="width:100px">
          <div class="bar"></div>
        </div>
      </div>

      <div class="game-layout">
        <div class="question-box">
          <div id="g1-question"></div>
        </div>
        
        
        <div class="image-box">
          <img id="g1-image" src="" alt=""></div>
      </div>



      <div class="display-5 text-center" id="g1-word">كلمة</div>
      <div class="row g-0" id="g1-options"></div>
    </div>
  </div>

  <div class="tab-pane fade" id="g2">
    <div class="card game-card p-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div>رتّب الحروف لتكوين الكلمة (الصورة للمساعدة)</div>
        <div class="progress-small" style="width:200px">
          <div class="bar"></div>
        </div>
      </div>
      <div id="g2-area"></div>
    </div>
  </div>
</div>
</main>

<div class="modal fade" id="resultModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered result-modal"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body"></div>
<div class="modal-footer"><button class="btn btn-primary btn-restart" data-bs-dismiss="modal">إعادة اللعب</button></div>
</div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="letters.js"></script>
<script src="common.js"></script>

</body>
</html>
