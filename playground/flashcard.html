<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title> تطابق الصور</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lateef&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
    background-image: url("image/background.jpeg");
    background-size: 100% 100%;      /* تغطي الشاشة */
    background-position: center; /* بالمنتصف */
    background-repeat: no-repeat;
    min-height: 100vh;
    font-family: 'Lateef', serif;
    text-align: center;
    font-weight: bold;
    color: rgb(133, 34, 34);
}/* rgb(46, 46, 169)*/

h2 {
    font-weight: bold;
    font-size: 35px;
    margin-top: 70px;
    margin-bottom: 30px;
}
.cell {
    border-radius: 20px;
    height: 135px;

    display: flex;
    align-items: center;
    justify-content: center;
}
/*     background: rgba(255,255,255,0.85);

/* الحاوية العامة */
.game {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    max-width: 900px;
    margin-top: 100px;
    margin-right: 178px;
    row-gap: 25px;
    column-gap: 30px;

}

/* مربعات الكلمات */
.word {
    font-size: 43px;
    transition: 0.3s;
}

/* مربعات الصور */
.image-box {
    width: 203px;
    height: 133px;
}

/* الصور */
.image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 30px;
}

/* صح */
.correct {
    color: green; 
    text-shadow: 0 2px 6px rgba(91, 194, 91, 0.623);
    transition: 0.3s;
}


/* خطأ */
.wrong {
    color: red; 
    text-shadow: 0 2px 6px rgba(244, 91, 91, 0.655);
    transition: 0.3s;
}
#backArrow {
    position: fixed;      /* تثبيت بالمكان */
    top: 20px;            /* من الأعلى */
    left: 20px; 
	margin: 5px;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 50px;           /* حجم الدائرة */
    height: 50px;
    background-color:rgb(133, 34, 34);; /* لون الدائرة */
    color: white;             /* لون السهم */
    border-radius: 50%;       /* يخليها دائرة */
    text-decoration: none;    /* إزالة الخط تحت النص */
    font-size: 27px;          /* حجم السهم */
    font-weight: bold;
	line-height: 1;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2); /* لمسة ظل */
    transition: transform 0.2s;
}

#backArrow:hover {
    transform: scale(1.2);    /* يكبر عند المرور */
    cursor: pointer;
}
.stars{
  display: flex;
  justify-content: center;
  gap: 8px;
  font-size: 32px;
}

.star::before{
  content: "☆";        /* نجمة فارغة */
  color: #ccc;
}

.star.on::before{
  content: "★";        /* نجمة ممتلئة */
  color: #f59e0b;      /* ذهبي */
}
.result-modal{
  max-width: 320px;   /* صغري أو كبري حسب ذوقك */
}

.modal-content{
  border-radius: 20px; /* اختياري: زوايا ناعمة */
}


</style>
</head>

<body>
<section id="topScreen">
        <a href="play.html" id="backArrow">&#8592;</a>
    </section>
<h2>اسحب الصورة على الكلمة الصحيحة</h2>

<div class="game">

    <!-- الكلمات -->
    <div class="cell">
        <div class="word" data-answer="father">ابي</div>
    </div>
    <div class="cell">
        <div class="word" data-answer="grandma">جدتي</div>
    </div>
    <div class="cell">
        <div class="word" data-answer="mother">امي</div>
    </div>
    <div class="cell">
        <div class="word" data-answer="sister">اختي</div>
    </div>

    <!-- الصور -->
    <div class="cell">
        <div class="image-box">
        <img src="image/sister.jpeg" draggable="true" data-type="sister">
    </div>
    </div>
    
    <div class="cell">
    <div class="image-box">
        <img src="image/father.jpeg" draggable="true" data-type="father">
    </div>
    </div>

    <div class="cell">
    <div class="image-box">
        <img src="image/grandma.jpeg" draggable="true" data-type="grandma">
    </div>
    </div>
    
    <div class="cell">
    <div class="image-box">
        <img src="image/mother.jpeg" draggable="true" data-type="mother">
    </div>
    </div>

</div>

<script>
    let correctCount = 0;
    const totalQuestions = document.querySelectorAll(".word").length;

let draggedItem = null;

/* 🔊 صوت الخطأ (واحد للجميع) */
const wrongSound = new Audio("assets/audio/fusha/wrong.mpeg");

/* 🔊 أصوات الصح حسب الصورة */
const correctSounds = {
    father: new Audio("assets/audio/fusha/father.mpeg"),
    mother: new Audio("assets/audio/fusha/mother.mpeg"),
    sister: new Audio("assets/audio/fusha/sister.mpeg"),
    grandma: new Audio("assets/audio/fusha/grandma.mpeg")
};

/* عند سحب الصورة */
document.querySelectorAll("img").forEach(img => {
    img.addEventListener("dragstart", () => {
        draggedItem = img;
    });
});

/* عند الإفلات على الكلمة */
document.querySelectorAll(".word").forEach(word => {

    word.addEventListener("dragover", e => {
        e.preventDefault();
    });

    word.addEventListener("drop", () => {
        const correctAnswer = word.dataset.answer;
        const imageType = draggedItem.dataset.type;

        if (correctAnswer === imageType) {
            word.classList.remove("wrong");
            word.classList.add("correct");

            /* 🔊 تشغيل صوت الصح المناسب */
            const sound = correctSounds[imageType];
            if (sound) {
                sound.currentTime = 0;
                sound.play();
            }

            draggedItem.style.display = "none";
            draggedItem.setAttribute("draggable", false);

            correctCount++;
            if (correctCount === totalQuestions) {
                setTimeout(() => {
                    showResultModal(4, restartGame);
                }, 500);
            }


        } else {
            word.classList.remove("correct");
            word.classList.add("wrong");

            /* 🔊 صوت الخطأ */
            wrongSound.currentTime = 0;
            wrongSound.play();
        }
    });

});
function restartGame(){
    location.reload();
}
</script>
<div class="modal fade" id="resultModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered result-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"></h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-primary btn-restart" data-bs-dismiss="modal">
          إعادة اللعب
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="common.js"></script>


</body>
</html>
